<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Kasir Ceria slides</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root{--cream:#FBF4EA;--peach:#FFD9C7;--mint:#CFF1DE;--butter:#FFE9B0;--lilac:#E6D5FB;--ink:#2A211B;--orange:#C2410C;--orange-l:#E8622A;
--display:"Outfit",system-ui,sans-serif;--body:"Work Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;background:var(--cream)}
/* Desain di unit mockup (HP 270x480, tablet 480x270), di-zoom ke ukuran asli */
#stage{position:relative;overflow:hidden}
.slide{position:absolute;inset:0;overflow:hidden}
.cap{position:absolute;left:20px;right:20px;top:26px;font-family:var(--display);color:var(--ink)}
.cap small{display:block;font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:8px}
.cap b{display:block;font-weight:800;font-size:30px;line-height:1.06;text-wrap:balance}
.cap em{font-style:normal;color:var(--orange)}
.phone{position:absolute;left:50%;transform:translateX(-50%);width:190px;aspect-ratio:1080/2400;border-radius:26px;background:#1d1714;padding:6px;box-shadow:0 18px 30px rgba(60,40,20,.28)}
.phone img{width:100%;height:100%;object-fit:cover;border-radius:20px;display:block}
.low .phone{top:150px}.high .phone{top:-60px}.high .cap{top:auto;bottom:26px}
.tilt .phone{transform:translateX(-50%) rotate(-6deg)}
.chip{position:absolute;background:#fff;border-radius:14px;padding:8px 11px;font:600 12px var(--display);color:var(--ink);box-shadow:0 8px 16px rgba(60,40,20,.18);white-space:nowrap}
.chip i{font-style:normal;color:#15803D}
.dark{background:var(--ink)}.dark .cap{color:#FBF4EA}.dark .cap small,.dark .cap em{color:#FFB38F}
.badge{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.badge span{font:600 11px var(--body);background:rgba(255,255,255,.7);border-radius:999px;padding:5px 9px;color:var(--ink)}
.hero{background:var(--lilac)}.hero::before,.thero::before{content:"";position:absolute;left:0;right:0;bottom:0;top:30%;background:url(../../assets/images/login_hero.webp) 70% 100%/auto 100% no-repeat;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14%);mask-image:linear-gradient(to bottom,transparent 0,#000 14%)}.hero .cap,.thero .cap{z-index:1}
.hlogo{width:44px;height:44px;border-radius:12px;display:block;margin-bottom:12px}
/* tablet */
.tab .cap{left:5%;top:14%;width:33%;right:auto}
.tab .cap b{font-size:26px}.tab .cap .hlogo{width:56px;height:56px;border-radius:15px}
.tab .dev{position:absolute;right:-4%;top:14%;width:60%;border-radius:16px;background:#1d1714;padding:6px;box-shadow:0 18px 30px rgba(60,40,20,.28)}
.tab .dev img{width:100%;display:block;border-radius:11px}
.thero{background:var(--lilac)}.thero::before{top:0;background-position:right bottom;-webkit-mask-image:none;mask-image:none}
/* feature graphic (1024x500, zoom 1) */
.fg{background:var(--lilac) url(../../assets/images/login_hero.webp) 135% 60%/auto 108% no-repeat}
.fg .in{position:absolute;left:6%;top:50%;transform:translateY(-50%);max-width:42%}
.fg .logo{width:96px;height:96px;border-radius:24px;display:block}
.fg b{display:block;font:800 62px/1.02 var(--display);color:var(--ink);margin-top:18px}
.fg p{font:500 26px/1.25 var(--body);color:#4B3A73;margin:12px 0 0}
</style></head><body>
<div id="stage"></div>
<script>
const P='../../screnshoot/';
const logo='<img class="hlogo" src="../../assets/images/app_logo.webp" alt="">';
const phones={
1:`<div class="slide hero"><div class="cap">${logo}<small>Gratis · Tanpa internet</small><b>Kasir <em>gratis</em> untuk warung &amp; cafe</b></div></div>`,
2:`<div class="slide low" style="background:var(--peach)"><div class="cap"><small>Kasir</small><b>Cari &amp; pilih menu <em>secepat kilat</em></b></div><div class="phone"><img src="${P}phone/04_kasir.png"></div></div>`,
3:`<div class="slide high tilt" style="background:var(--mint)"><div class="phone"><img src="${P}phone/05_rincian_bayar.png"></div><div class="chip" style="right:14px;top:210px">Total <i>Rp 43.000</i></div><div class="cap"><small>Cepat</small><b>Bayar dalam <em>sekali tap</em></b></div></div>`,
4:`<div class="slide low" style="background:var(--butter)"><div class="cap"><small>Printer Bluetooth</small><b>Struk rapi, <em>langsung cetak</em></b></div><div class="phone"><img src="${P}phone/06_struk.png"></div></div>`,
5:`<div class="slide low dark"><div class="cap"><small>Laporan &amp; pengeluaran</small><b>Tahu <em>untung</em> tiap hari</b></div><div class="phone"><img src="${P}phone/07_laporan.png"></div></div>`,
6:`<div class="slide low" style="background:var(--lilac)"><div class="cap"><small>Data milik Anda</small><b>Aman di HP, <em>pindah HP</em> mudah</b><div class="badge"><span>Offline</span><span>Backup</span><span>Multi user</span><span>Tanpa iklan</span></div></div><div class="phone" style="top:190px"><img src="${P}phone/01_buat_akun.png"></div></div>`};
const tab=(cls,style,cap,img)=>`<div class="slide tab ${cls}" style="${style}"><div class="cap">${cap}</div>${img?`<div class="dev"><img src="${P}tablet/${img}"></div>`:''}</div>`;
const tablets={
1:tab('thero','',`${logo}<b>Kasir gratis untuk warung &amp; cafe</b>`),
2:tab('','background:var(--peach)','<b>Layar lega untuk kasir tablet</b>','04_kasir.png'),
3:tab('dark','','<b style="color:#FBF4EA">Omzet &amp; laba sekali lihat</b>','07_laporan.png'),
4:tab('','background:var(--mint)','<b>Pengeluaran tercatat rapi</b>','08_pengeluaran.png')};
const fg=`<div class="slide fg"><div class="in"><img class="logo" src="../../assets/images/app_logo.webp" alt=""><b>Kasir Ceria</b><p>Kasir gratis &amp; offline<br>untuk UMKM</p></div></div>`;
const q=new URLSearchParams(location.search),d=q.get('d')||'phone',n=q.get('n')||'1';
const st=document.getElementById('stage');
let w,h,z,html;
if(d=='phone'){w=270;h=480;z=4;html=phones[n]}
else if(d=='tablet'){w=480;h=270;z=4;html=tablets[n]}
else{w=1024;h=500;z=1;html=fg}
st.style.cssText=`width:${w}px;height:${h}px;zoom:${z}`;
st.innerHTML=html;
</script></body></html>
